name: radio_mix
description: Aplicación de radio que combina streaming digital y sintonía FM

publish_to: 'none'

version: 1.6.5+5

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Audio
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  audio_session: ^0.2.4
    
  # Funcionalidades
  http: ^1.6.0
  shared_preferences: ^2.5.5
  xml: ^7.0.1
  
  # Utilidades
  flutter_riverpod: ^3.4.2
  crypto: ^3.0.7
  
  # Backup y compartir
  file_picker: ^11.0.3
  # share_plus 13 y package_info_plus 10 requieren win32 6, incompatible con
  # la versión estable actual de file_picker.
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  dynamic_color: ^1.9.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
