name: radio_mix
description: Aplicación de radio que combina streaming digital y sintonía FM

publish_to: 'none'

version: 1.6.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Audio
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.10
  audio_service: ^0.18.18
  audio_session: ^0.2.3
    
  # Funcionalidades
  http: ^1.3.0
  shared_preferences: ^2.5.5
  xml: ^6.5.0
  
  # Utilidades
  flutter_riverpod: ^3.3.1
  crypto: ^3.0.6
  
  # Backup y compartir
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  dynamic_color: ^1.8.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
